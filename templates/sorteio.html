<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sorteio ArenaPlay</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="content">

    <h1>🎲 Sorteio ArenaPlay</h1>

    <p>Selecione os jogadores presentes e a quantidade de times.</p>

    <div class="quadra-card">

        <form method="POST" action="/sortear">

            <h3>Quantidade de Times</h3>

            <select name="qtd_times" class="form-control">

                <option value="2">2 Times</option>
                <option value="3">3 Times</option>
                <option value="4">4 Times</option>
                <option value="5" selected>5 Times</option>

            </select>

            <hr>

            <h3>👥 Jogadores Presentes</h3>

            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;">

                {% for jogador in jogadores %}

                <label style="padding:10px;border:1px solid #2d3748;border-radius:8px;cursor:pointer;">

                    <input
                        type="checkbox"
                        name="jogadores"
                        value="{{ jogador.id }}"
                    >

                    <strong>{{ jogador.nome }}</strong>

                    <span style="color:#00d26a;">
                        ({{ jogador.nivel }})
                    </span>

                </label>

                {% endfor %}

            </div>

            <br>

            <button type="submit" class="btn-primary">

                🎲 Sortear Times

            </button>

        </form>

    </div>

</div>

</body>
</html>
